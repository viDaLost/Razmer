name: Проверка и публикация на GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Проверка
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Синтаксис скриптов
        run: |
          node --check js/platform.js
          node --check js/engine.js
          node --check js/app.js
          node --check sw.js
      - name: Тесты раскладки
        run: node scripts/engine-test.cjs
      - name: Файлы сайта на месте
        run: node scripts/check-site.cjs

  deploy:
    name: Публикация
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Собрать сайт
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest sw.js js icons _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
